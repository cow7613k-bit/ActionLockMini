
name: Build ActionLock Mini APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ActionLockMini-Android-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract source
        run: unzip -q ActionLockMini-Android-Source.zip

      - name: Build APK
        working-directory: ActionLockMini
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ActionLockMini-APK
          path: ActionLockMini/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
